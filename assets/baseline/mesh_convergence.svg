<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560">
  <style>
    .title{font:700 26px Arial,sans-serif;fill:#111}
    .sub{font:14px Arial,sans-serif;fill:#444}
    .axis{stroke:#444;stroke-width:1.5}
    .grid{stroke:#ddd;stroke-width:1}
    .tick{font:13px Arial,sans-serif;fill:#333}
    .label{font:14px Arial,sans-serif;fill:#222}
    .legend{font:14px Arial,sans-serif;fill:#222}
  </style>
  <rect width="980" height="560" fill="white"/>
  <text x="490" y="38" text-anchor="middle" class="title">Mesh Convergence — Relative Deviation from M3</text>
  <text x="490" y="62" text-anchor="middle" class="sub">Final gripping position: actuator displacement = -28.8 mm</text>

  <!-- plot area: x 100..900, y 100..470; 0..8% -->
  <line x1="100" y1="470" x2="900" y2="470" class="axis"/>
  <line x1="100" y1="100" x2="100" y2="470" class="axis"/>

  <!-- horizontal grid/ticks -->
  <g>
    <line x1="100" y1="470" x2="900" y2="470" class="grid"/><text x="88" y="475" text-anchor="end" class="tick">0%</text>
    <line x1="100" y1="377.5" x2="900" y2="377.5" class="grid"/><text x="88" y="382.5" text-anchor="end" class="tick">2%</text>
    <line x1="100" y1="285" x2="900" y2="285" class="grid"/><text x="88" y="290" text-anchor="end" class="tick">4%</text>
    <line x1="100" y1="192.5" x2="900" y2="192.5" class="grid"/><text x="88" y="197.5" text-anchor="end" class="tick">6%</text>
    <line x1="100" y1="100" x2="900" y2="100" class="grid"/><text x="88" y="105" text-anchor="end" class="tick">8%</text>
  </g>

  <!-- x positions -->
  <g class="tick">
    <text x="140" y="495" text-anchor="middle">M0</text>
    <text x="380" y="495" text-anchor="middle">M1</text>
    <text x="620" y="495" text-anchor="middle">M2</text>
    <text x="860" y="495" text-anchor="middle">M3</text>
  </g>
  <text x="500" y="530" text-anchor="middle" class="label">Mesh level</text>
  <text x="24" y="285" transform="rotate(-90 24 285)" text-anchor="middle" class="label">Absolute deviation from M3 (%)</text>

  <!-- Reaction Force: 0.37,0.30,0.15,0 -->
  <polyline points="140,452.9 380,456.1 620,463.1 860,470" fill="none" stroke="#1f77b4" stroke-width="3"/>
  <!-- Eq Stress: 3.74,2.14,3.45,0 -->
  <polyline points="140,297.0 380,371.0 620,310.4 860,470" fill="none" stroke="#d62728" stroke-width="3"/>
  <!-- Principal Stress: 6.12,6.88,1.88,0 -->
  <polyline points="140,186.9 380,151.8 620,383.1 860,470" fill="none" stroke="#2ca02c" stroke-width="3"/>
  <!-- Contact Pressure: 0.23,0.30,0.06,0 -->
  <polyline points="140,459.4 380,456.1 620,467.2 860,470" fill="none" stroke="#9467bd" stroke-width="3"/>

  <!-- points -->
  <g fill="#1f77b4"><circle cx="140" cy="452.9" r="5"/><circle cx="380" cy="456.1" r="5"/><circle cx="620" cy="463.1" r="5"/><circle cx="860" cy="470" r="5"/></g>
  <g fill="#d62728"><circle cx="140" cy="297.0" r="5"/><circle cx="380" cy="371.0" r="5"/><circle cx="620" cy="310.4" r="5"/><circle cx="860" cy="470" r="5"/></g>
  <g fill="#2ca02c"><circle cx="140" cy="186.9" r="5"/><circle cx="380" cy="151.8" r="5"/><circle cx="620" cy="383.1" r="5"/><circle cx="860" cy="470" r="5"/></g>
  <g fill="#9467bd"><circle cx="140" cy="459.4" r="5"/><circle cx="380" cy="456.1" r="5"/><circle cx="620" cy="467.2" r="5"/><circle cx="860" cy="470" r="5"/></g>

  <!-- legend -->
  <rect x="610" y="112" width="276" height="108" rx="8" fill="#fff" stroke="#ccc"/>
  <line x1="630" y1="138" x2="668" y2="138" stroke="#1f77b4" stroke-width="3"/><text x="680" y="143" class="legend">Reaction force</text>
  <line x1="630" y1="162" x2="668" y2="162" stroke="#d62728" stroke-width="3"/><text x="680" y="167" class="legend">Max equivalent stress</text>
  <line x1="630" y1="186" x2="668" y2="186" stroke="#2ca02c" stroke-width="3"/><text x="680" y="191" class="legend">Max principal stress</text>
  <line x1="630" y1="210" x2="668" y2="210" stroke="#9467bd" stroke-width="3"/><text x="680" y="215" class="legend">Max contact pressure</text>
</svg>