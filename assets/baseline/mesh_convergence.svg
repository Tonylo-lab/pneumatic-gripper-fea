<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#111}
    .sub{font:15px Arial,sans-serif;fill:#555}
    .axis{stroke:#333;stroke-width:1.6}
    .grid{stroke:#ddd;stroke-width:1}
    .tick{font:13px Arial,sans-serif;fill:#333}
    .label{font:15px Arial,sans-serif;fill:#222}
    .legend{font:14px Arial,sans-serif;fill:#222}
    .note{font:13px Arial,sans-serif;fill:#555}
  </style>

  <rect width="1100" height="650" fill="white"/>

  <text x="550" y="42" text-anchor="middle" class="title">Mesh Convergence — Relative Difference from M3</text>
  <text x="550" y="68" text-anchor="middle" class="sub">Baseline gripper at actuator displacement = -28.8 mm</text>

  <!-- Plot area -->
  <line x1="120" y1="540" x2="1010" y2="540" class="axis"/>
  <line x1="120" y1="110" x2="120" y2="540" class="axis"/>

  <!-- Horizontal grid: 0 to 8% -->
  <g>
    <line x1="120" y1="540" x2="1010" y2="540" class="grid"/><text x="105" y="545" text-anchor="end" class="tick">0%</text>
    <line x1="120" y1="432.5" x2="1010" y2="432.5" class="grid"/><text x="105" y="437.5" text-anchor="end" class="tick">2%</text>
    <line x1="120" y1="325" x2="1010" y2="325" class="grid"/><text x="105" y="330" text-anchor="end" class="tick">4%</text>
    <line x1="120" y1="217.5" x2="1010" y2="217.5" class="grid"/><text x="105" y="222.5" text-anchor="end" class="tick">6%</text>
    <line x1="120" y1="110" x2="1010" y2="110" class="grid"/><text x="105" y="115" text-anchor="end" class="tick">8%</text>
  </g>

  <!-- X-axis ticks based on node count -->
  <g class="tick">
    <line x1="120" y1="540" x2="120" y2="547" class="axis"/><text x="120" y="570" text-anchor="middle">115k</text>
    <line x1="204" y1="540" x2="204" y2="547" class="axis"/><text x="204" y="570" text-anchor="middle">128k</text>
    <line x1="462" y1="540" x2="462" y2="547" class="axis"/><text x="462" y="570" text-anchor="middle">168k</text>
    <line x1="800" y1="540" x2="800" y2="547" class="axis"/><text x="800" y="570" text-anchor="middle">220k</text>
  </g>

  <text x="560" y="610" text-anchor="middle" class="label">Node count</text>
  <text x="34" y="325" transform="rotate(-90 34 325)" text-anchor="middle" class="label">Absolute difference from M3 (%)</text>

  <!-- Reaction Force: 0.367, 0.304, 0.152, 0 -->
  <polyline points="120,520.3 204,523.6 462,531.8 800,540" fill="none" stroke="#1f77b4" stroke-width="3"/>
  <!-- Eq Stress: 3.739, 2.142, 3.453, 0 -->
  <polyline points="120,339.1 204,424.9 462,354.4 800,540" fill="none" stroke="#d62728" stroke-width="3"/>
  <!-- Principal Stress: 6.124, 6.877, 1.876, 0 -->
  <polyline points="120,210.9 204,170.3 462,439.2 800,540" fill="none" stroke="#2ca02c" stroke-width="3"/>
  <!-- Contact Pressure: 0.228, 0.298, 0.061, 0 -->
  <polyline points="120,527.8 204,524.0 462,536.7 800,540" fill="none" stroke="#9467bd" stroke-width="3"/>

  <!-- Markers -->
  <g fill="#1f77b4"><circle cx="120" cy="520.3" r="5"/><circle cx="204" cy="523.6" r="5"/><circle cx="462" cy="531.8" r="5"/><circle cx="800" cy="540" r="5"/></g>
  <g fill="#d62728"><circle cx="120" cy="339.1" r="5"/><circle cx="204" cy="424.9" r="5"/><circle cx="462" cy="354.4" r="5"/><circle cx="800" cy="540" r="5"/></g>
  <g fill="#2ca02c"><circle cx="120" cy="210.9" r="5"/><circle cx="204" cy="170.3" r="5"/><circle cx="462" cy="439.2" r="5"/><circle cx="800" cy="540" r="5"/></g>
  <g fill="#9467bd"><circle cx="120" cy="527.8" r="5"/><circle cx="204" cy="524.0" r="5"/><circle cx="462" cy="536.7" r="5"/><circle cx="800" cy="540" r="5"/></g>

  <!-- Mesh labels -->
  <g class="tick">
    <text x="120" y="95" text-anchor="middle">M0</text>
    <text x="204" y="95" text-anchor="middle">M1</text>
    <text x="462" y="95" text-anchor="middle">M2</text>
    <text x="800" y="95" text-anchor="middle">M3</text>
  </g>

  <!-- Legend -->
  <rect x="720" y="125" width="285" height="125" rx="8" fill="#fff" stroke="#ccc"/>
  <line x1="742" y1="153" x2="785" y2="153" stroke="#1f77b4" stroke-width="3"/><text x="797" y="158" class="legend">Reaction force</text>
  <line x1="742" y1="181" x2="785" y2="181" stroke="#d62728" stroke-width="3"/><text x="797" y="186" class="legend">Max equivalent stress</text>
  <line x1="742" y1="209" x2="785" y2="209" stroke="#2ca02c" stroke-width="3"/><text x="797" y="214" class="legend">Max principal stress</text>
  <line x1="742" y1="237" x2="785" y2="237" stroke="#9467bd" stroke-width="3"/><text x="797" y="242" class="legend">Max contact pressure</text>

  <text x="120" y="635" class="note">M3 is used as the reference; lower values indicate closer agreement with the finest mesh.</text>
</svg>